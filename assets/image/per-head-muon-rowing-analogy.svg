<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Per-Head Muon 的矩阵粒度</title><desc id="desc">整体 Attention Projection 按 Head 分块，每个 Head 的矩阵独立进入 Muon 更新。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526078"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#12213a}.t{font-size:46px;font-weight:700}.s{font-size:24px;fill:#5d6b80}.h{font-size:27px;font-weight:700}.b{font-size:23px;fill:#536278}.k{font-size:20px;fill:#66758a}.line{stroke:#526078;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" rx="30" fill="#f6f8fc"/><text x="80" y="85" class="t">Per-Head Muon：改变“一个独立矩阵”的边界</text><text x="80" y="124" class="s">不是把整个 Attention Projection 一起正交化，而是按 Head 分块分别更新</text><path d="M80 160H1520" stroke="#d6deea" stroke-width="2"/>
  <rect x="95" y="240" width="530" height="470" rx="20" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="135" y="290" class="h">整体矩阵 Muon</text><text x="135" y="326" class="b">WQ = [WQ¹ | WQ² | WQ³ | WQ⁴]</text>
  <g stroke="#2876f9" stroke-width="3"><rect x="170" y="385" width="355" height="150" rx="6" fill="#eaf2ff"/><path d="M259 385V535M348 385V535M437 385V535"/></g><g class="b" text-anchor="middle"><text x="214" y="468">H1</text><text x="303" y="468">H2</text><text x="392" y="468">H3</text><text x="481" y="468">H4</text></g>
  <rect x="185" y="592" width="325" height="58" rx="12" fill="#eaf2ff" stroke="#2876f9" stroke-width="2"/><text x="347" y="629" text-anchor="middle" class="b">一次 Muon 更新整个矩阵</text>
  <path d="M625 460H760" class="line"/>
  <rect x="810" y="240" width="710" height="470" rx="20" fill="#fff" stroke="#7658e8" stroke-width="3"/><text x="850" y="290" class="h" fill="#6347d4">Per-Head Muon</text><text x="850" y="326" class="b">每个 Head 是一个 logically independent matrix</text>
  <g><rect x="860" y="390" width="110" height="100" rx="12" fill="#f1edff" stroke="#7658e8" stroke-width="2"/><rect x="1015" y="390" width="110" height="100" rx="12" fill="#e6f7f0" stroke="#14956f" stroke-width="2"/><rect x="1170" y="390" width="110" height="100" rx="12" fill="#fff5df" stroke="#e89914" stroke-width="2"/><rect x="1325" y="390" width="110" height="100" rx="12" fill="#fdebec" stroke="#d33a36" stroke-width="2"/></g><g class="h" text-anchor="middle"><text x="915" y="450" fill="#6347d4">H1</text><text x="1070" y="450" fill="#108264">H2</text><text x="1225" y="450" fill="#d58000">H3</text><text x="1380" y="450" fill="#b72825">H4</text></g>
  <g class="b" text-anchor="middle"><text x="915" y="555">Muon(G¹)</text><text x="1070" y="555">Muon(G²)</text><text x="1225" y="555">Muon(G³)</text><text x="1380" y="555">Muon(G⁴)</text></g><g stroke="#526078" stroke-width="3" marker-end="url(#a)"><path d="M915 490V525"/><path d="M1070 490V525"/><path d="M1225 490V525"/><path d="M1380 490V525"/></g>
  <rect x="875" y="610" width="530" height="56" rx="12" fill="#f1edff" stroke="#7658e8" stroke-width="2"/><text x="1140" y="646" text-anchor="middle" class="b">分别正交化与缩放，再拼回 Projection</text>
  <rect x="170" y="780" width="1260" height="60" rx="14" fill="#fff" stroke="#d33a36" stroke-width="2"/><text x="800" y="819" text-anchor="middle" class="h" fill="#b72825">边界：切得更细不保证严格更优；联合几何、硬件利用率与更新范数仍需实验证实</text>
</svg>
