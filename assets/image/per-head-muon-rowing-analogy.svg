<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="system-ui,'Microsoft YaHei'" font-size="32" font-weight="700" fill="#172033">Per-Head Muon：不是校准整条船，而是校准每个划手</text>
  <text x="60" y="98" font-family="system-ui,'Microsoft YaHei'" font-size="17" fill="#596579">Attention Head 功能不同，K3 选择让每个 Head 拥有独立的矩阵几何与更新尺度</text>
  <rect x="60" y="150" width="520" height="430" rx="24" fill="#fff" stroke="#2878ff" stroke-width="3"/>
  <text x="320" y="192" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#2878ff">整矩阵 Muon：把整条船看成一个对象</text>
  <path d="M120 430 Q320 520 520 430 L490 500 Q320 575 150 500Z" fill="#e7f0ff" stroke="#2878ff" stroke-width="3"/>
  <g font-family="system-ui,'Microsoft YaHei'" text-anchor="middle"><circle cx="200" cy="340" r="30" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="200" y="346" font-size="15" font-weight="700" fill="#6d5ce7">H1</text><circle cx="280" cy="330" r="30" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="280" y="336" font-size="15" font-weight="700" fill="#1f9d70">H2</text><circle cx="360" cy="330" r="30" fill="#fff2d8" stroke="#e59a18" stroke-width="2"/><text x="360" y="336" font-size="15" font-weight="700" fill="#c77d08">H3</text><circle cx="440" cy="340" r="30" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="440" y="346" font-size="15" font-weight="700" fill="#b91c1c">H4</text></g>
  <line x1="170" y1="375" x2="135" y2="445" stroke="#6d5ce7" stroke-width="6"/><line x1="255" y1="365" x2="225" y2="450" stroke="#1f9d70" stroke-width="6"/><line x1="385" y1="365" x2="415" y2="450" stroke="#e59a18" stroke-width="6"/><line x1="470" y1="375" x2="505" y2="445" stroke="#ef4444" stroke-width="6"/>
  <text x="320" y="540" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">所有 Head 拼进一个大矩阵，共享同一次正交化</text>
  <rect x="620" y="150" width="520" height="430" rx="24" fill="#fff" stroke="#7c5ce7" stroke-width="3"/>
  <text x="880" y="192" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#6d5ce7">Per-Head Muon：每个划手单独校准</text>
  <g font-family="system-ui,'Microsoft YaHei'" text-anchor="middle"><rect x="690" y="235" width="160" height="100" rx="16" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="770" y="270" font-size="17" font-weight="700" fill="#6d5ce7">Head 1</text><text x="770" y="300" font-size="14" fill="#596579">独立谱结构</text><rect x="910" y="235" width="160" height="100" rx="16" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="990" y="270" font-size="17" font-weight="700" fill="#1f9d70">Head 2</text><text x="990" y="300" font-size="14" fill="#596579">独立更新尺度</text><rect x="690" y="385" width="160" height="100" rx="16" fill="#fff2d8" stroke="#e59a18" stroke-width="2"/><text x="770" y="420" font-size="17" font-weight="700" fill="#c77d08">Head 3</text><text x="770" y="450" font-size="14" fill="#596579">独立正交化</text><rect x="910" y="385" width="160" height="100" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="990" y="420" font-size="17" font-weight="700" fill="#b91c1c">Head 4</text><text x="990" y="450" font-size="14" fill="#596579">减少互相支配</text></g>
  <text x="880" y="535" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">改变的是“什么算一个 logically independent matrix”</text>
  <rect x="95" y="620" width="1010" height="70" rx="16" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="600" y="648" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#b91c1c">类比边界：拆得更细不保证严格更优</text><text x="600" y="674" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">独立 Whitening 的收益，要与联合几何信息、小矩阵效率和更新范数变化共同权衡</text>
</svg>