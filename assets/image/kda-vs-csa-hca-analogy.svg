<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KDA 与 CSA HCA 的比较</title><desc id="desc">两种路线压缩历史后保留的对象不同：KDA 保留状态，CSA HCA 保留条目。</desc>
  <defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#12213a}.t{font-size:46px;font-weight:700}.s{font-size:24px;fill:#5d6b80}.h{font-size:27px;font-weight:700}.b{font-size:23px;fill:#536278}.k{font-size:20px;fill:#66758a}.cell{fill:#fff;stroke:#d1dbe8;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="30" fill="#f6f8fc"/><text x="80" y="85" class="t">KDA 与 CSA / HCA：不是前后步骤，而是两种记忆形态</text><text x="80" y="124" class="s">共享比较维度，避免用单向箭头误读为技术演进</text><path d="M80 160H1520" stroke="#d6deea" stroke-width="2"/>
  <rect x="80" y="205" width="530" height="90" rx="16" fill="#f1edff" stroke="#7658e8" stroke-width="3"/><text x="345" y="260" text-anchor="middle" class="h" fill="#6347d4">KDA · 压缩为可编辑状态</text>
  <rect x="990" y="205" width="530" height="90" rx="16" fill="#eaf2ff" stroke="#2876f9" stroke-width="3"/><text x="1255" y="260" text-anchor="middle" class="h" fill="#1965db">CSA / HCA · 压缩为可检索条目</text>
  <g class="h" text-anchor="middle"><text x="800" y="350">历史保存形式</text><text x="800" y="455">更新 / 生成</text><text x="800" y="560">读取方式</text><text x="800" y="665">主要优势</text></g>
  <g><rect x="80" y="315" width="530" height="70" rx="12" class="cell"/><text x="345" y="358" text-anchor="middle" class="b">固定大小的状态矩阵</text><rect x="990" y="315" width="530" height="70" rx="12" class="cell"/><text x="1255" y="358" text-anchor="middle" class="b">一串显式压缩 KV Entry</text>
  <rect x="80" y="420" width="530" height="70" rx="12" class="cell"/><text x="345" y="463" text-anchor="middle" class="b">连续衰减、擦除与误差写入</text><rect x="990" y="420" width="530" height="70" rx="12" class="cell"/><text x="1255" y="463" text-anchor="middle" class="b">生成并保存新的压缩条目</text>
  <rect x="80" y="525" width="530" height="70" rx="12" class="cell"/><text x="345" y="568" text-anchor="middle" class="b">对整体状态做线性读取</text><rect x="990" y="525" width="530" height="70" rx="12" class="cell"/><text x="1255" y="568" text-anchor="middle" class="b">对具体条目打分并 Attention</text>
  <rect x="80" y="630" width="530" height="70" rx="12" fill="#f1edff" stroke="#7658e8" stroke-width="2"/><text x="345" y="673" text-anchor="middle" class="b">长 Decode、连续编辑、近似固定 Cache</text><rect x="990" y="630" width="530" height="70" rx="12" fill="#eaf2ff" stroke="#2876f9" stroke-width="2"/><text x="1255" y="673" text-anchor="middle" class="b">定位具体历史块、精确回查</text></g>
  <rect x="190" y="770" width="1220" height="62" rx="14" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="800" y="810" text-anchor="middle" class="h">结论：KDA 精细地编辑状态；CSA / HCA 精细地定位条目</text>
</svg>
