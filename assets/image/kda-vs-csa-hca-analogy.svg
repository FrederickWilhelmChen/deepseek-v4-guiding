<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#596579"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="system-ui,'Microsoft YaHei'" font-size="32" font-weight="700" fill="#172033">KDA 与 CSA / HCA：白板记忆 vs 分层档案柜</text>
  <text x="60" y="98" font-family="system-ui,'Microsoft YaHei'" font-size="17" fill="#596579">两边都在压缩历史，但压缩后留下的“东西”并不一样</text>
  <rect x="60" y="140" width="520" height="450" rx="24" fill="#fff" stroke="#7c5ce7" stroke-width="3"/>
  <text x="320" y="182" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="23" font-weight="700" fill="#6d5ce7">KDA：可擦写白板</text>
  <rect x="105" y="225" width="430" height="240" rx="18" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/>
  <path d="M150 270 C230 230,300 325,390 270 S500 290,500 290" fill="none" stroke="#6d5ce7" stroke-width="5"/>
  <path d="M145 345 C250 390,330 300,500 365" fill="none" stroke="#2878ff" stroke-width="5" opacity=".8"/>
  <path d="M150 420 C260 370,380 470,500 405" fill="none" stroke="#1f9d70" stroke-width="5" opacity=".6"/>
  <text x="320" y="505" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#172033">历史被叠加进固定大小状态</text>
  <text x="320" y="535" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">擅长：持续编辑、长 Decode、固定 Cache</text>
  <rect x="620" y="140" width="520" height="450" rx="24" fill="#fff" stroke="#2878ff" stroke-width="3"/>
  <text x="880" y="182" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="23" font-weight="700" fill="#2878ff">CSA / HCA：分层档案柜</text>
  <rect x="680" y="225" width="400" height="65" rx="12" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="880" y="265" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#2878ff">近期抽屉：原始 Sliding Window</text>
  <rect x="680" y="315" width="400" height="65" rx="12" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="880" y="355" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#1f9d70">CSA 抽屉：中等压缩 + Top-K 检索</text>
  <rect x="680" y="405" width="400" height="65" rx="12" fill="#fff2d8" stroke="#e59a18" stroke-width="2"/><text x="880" y="445" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#c77d08">HCA 抽屉：重压缩 + 全局读取</text>
  <text x="880" y="505" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#172033">压缩后仍保留一串可寻址条目</text>
  <text x="880" y="535" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">擅长：定位具体历史块、精确回查</text>
  <line x1="580" y1="365" x2="620" y2="365" stroke="#596579" stroke-width="3" marker-end="url(#a)"/>
  <rect x="90" y="620" width="1020" height="62" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="648" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#172033">核心差异：KDA 更精细地“编辑状态”，CSA / HCA 更精细地“定位条目”</text>
  <text x="600" y="672" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">Compress into state, then update  vs  Compress into entries, then retrieve</text>
</svg>