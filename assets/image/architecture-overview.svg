<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="980" viewBox="0 0 1448 980">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 56px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .head { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: white; }
      .item { font: 500 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .caption { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .summary { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .small-icon { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .tiny { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect width="1448" height="980" fill="#f8fafc"/>

  <text x="724" y="72" text-anchor="middle" class="title">第 2 章：Architecture 总览</text>
  <text x="724" y="122" text-anchor="middle" class="subtitle">长上下文注意力、信息流稳定性、矩阵级训练优化</text>

  <!-- Left column -->
  <g filter="url(#shadow)">
    <rect x="48" y="166" width="412" height="620" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M68 166h372a20 20 0 0 1 20 20v82H48v-82a20 20 0 0 1 20-20z" fill="#2563eb"/>
    <text x="80" y="224" class="small-icon" fill="white">🧠</text>
    <text x="154" y="224" class="head">长上下文注意力</text>

    <rect x="80" y="302" width="348" height="82" rx="10" fill="white" stroke="#bfdbfe"/>
    <text x="118" y="354" class="small-icon" fill="#2563eb">◫</text>
    <text x="194" y="354" class="item">CSA：筛重点</text>

    <rect x="80" y="408" width="348" height="82" rx="10" fill="white" stroke="#bfdbfe"/>
    <text x="118" y="460" class="small-icon" fill="#2563eb">▤</text>
    <text x="194" y="460" class="item">HCA：留背景</text>

    <rect x="80" y="514" width="348" height="82" rx="10" fill="white" stroke="#bfdbfe"/>
    <text x="118" y="566" class="small-icon" fill="#2563eb">∞</text>
    <text x="194" y="566" class="item">支持 1M context</text>

    <rect x="80" y="620" width="348" height="82" rx="10" fill="white" stroke="#bfdbfe"/>
    <text x="118" y="672" class="small-icon" fill="#2563eb">⇄</text>
    <text x="194" y="672" class="item">交替使用压缩机制</text>

    <line x1="80" y1="732" x2="428" y2="732" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="254" y="770" text-anchor="middle" class="caption" fill="#1e40af">解决：长上下文怎么看得下</text>
  </g>

  <!-- Middle column -->
  <g filter="url(#shadow)">
    <rect x="518" y="166" width="412" height="620" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M538 166h372a20 20 0 0 1 20 20v82H518v-82a20 20 0 0 1 20-20z" fill="#16a34a"/>
    <text x="550" y="224" class="small-icon" fill="white">🌉</text>
    <text x="624" y="224" class="head">mHC 信息流</text>

    <rect x="550" y="320" width="348" height="90" rx="10" fill="white" stroke="#bbf7d0"/>
    <text x="590" y="377" class="small-icon" fill="#16a34a">↗</text>
    <text x="644" y="377" class="item">改造残差连接</text>

    <rect x="550" y="452" width="348" height="90" rx="10" fill="white" stroke="#bbf7d0"/>
    <text x="590" y="509" class="small-icon" fill="#16a34a">▦</text>
    <text x="644" y="509" class="item">多路径信息融合</text>

    <rect x="550" y="584" width="348" height="90" rx="10" fill="white" stroke="#bbf7d0"/>
    <text x="590" y="641" class="small-icon" fill="#16a34a">✓</text>
    <text x="644" y="641" class="item">提升深层稳定性</text>

    <line x1="550" y1="732" x2="898" y2="732" stroke="#4ade80" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="724" y="770" text-anchor="middle" class="caption" fill="#166534">解决：超深结构怎么传得稳</text>
  </g>

  <!-- Right column -->
  <g filter="url(#shadow)">
    <rect x="988" y="166" width="412" height="620" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <path d="M1008 166h372a20 20 0 0 1 20 20v82H988v-82a20 20 0 0 1 20-20z" fill="#ea580c"/>
    <text x="1020" y="224" class="small-icon" fill="white">📐</text>
    <text x="1092" y="224" class="head">Muon 优化器</text>

    <rect x="1020" y="320" width="348" height="90" rx="10" fill="white" stroke="#fed7aa"/>
    <text x="1060" y="377" class="small-icon" fill="#ea580c">□</text>
    <text x="1128" y="377" class="item">面向矩阵参数</text>

    <rect x="1020" y="452" width="348" height="90" rx="10" fill="white" stroke="#fed7aa"/>
    <text x="1060" y="509" class="small-icon" fill="#ea580c">↔</text>
    <text x="1128" y="509" class="item">关注整体几何结构</text>

    <rect x="1020" y="584" width="348" height="90" rx="10" fill="white" stroke="#fed7aa"/>
    <text x="1060" y="641" class="small-icon" fill="#ea580c">⚙</text>
    <text x="1128" y="641" class="item">更稳定地更新方向</text>

    <line x1="1020" y1="732" x2="1368" y2="732" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="1194" y="770" text-anchor="middle" class="caption" fill="#9a3412">解决：训练怎么更快更稳</text>
  </g>

  <!-- Summary strip -->
  <g filter="url(#shadow)">
    <rect x="48" y="838" width="1352" height="98" rx="18" fill="#fefce8" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="112" cy="887" r="30" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="112" cy="887" r="10" fill="#ca8a04"/>
    <text x="172" y="897" class="summary" fill="#1f2937">Architecture = </text>
    <text x="440" y="897" class="summary" fill="#1d4ed8">长上下文压缩</text>
    <text x="668" y="897" class="summary" fill="#166534"> + 稳定信息流</text>
    <text x="910" y="897" class="summary" fill="#c2410c"> + matrix-aware 训练优化</text>
  </g>
</svg>
