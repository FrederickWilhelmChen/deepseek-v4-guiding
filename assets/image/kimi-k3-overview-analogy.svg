<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 架构地图</title><desc id="desc">KDA、Gated MLA、LatentMoE、Attention Residuals 与训练基础设施之间的关系。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526078"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#12213a}.t{font-size:46px;font-weight:700}.s{font-size:24px;fill:#5d6b80}.h{font-size:27px;font-weight:700}.b{font-size:23px;fill:#536278}.k{font-size:20px;fill:#66758a}.card{fill:#fff;stroke:#cdd8e6;stroke-width:2}.line{stroke:#526078;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" rx="30" fill="#f6f8fc"/><text x="80" y="84" class="t">Kimi K3：一张按技术角色组织的架构地图</text><text x="80" y="124" class="s">主路径负责 Token 计算；旁路负责跨深度读取；下方能力保障训练和部署</text><path d="M80 160H1520" stroke="#d6deea" stroke-width="2"/>
  <rect x="78" y="315" width="210" height="170" rx="18" class="card"/><text x="183" y="372" text-anchor="middle" class="h">输入表示</text><text x="183" y="409" text-anchor="middle" class="b">文本 / 图像 / 视频</text><text x="183" y="438" text-anchor="middle" class="k">统一 Token 表示</text>
  <rect x="390" y="230" width="570" height="355" rx="24" fill="#fff" stroke="#bfcce0" stroke-width="2"/><text x="430" y="278" class="h">序列计算主干</text>
  <rect x="430" y="320" width="210" height="150" rx="16" fill="#f0ecff" stroke="#7658e8" stroke-width="3"/><text x="535" y="370" text-anchor="middle" class="h" fill="#6347d4">KDA</text><text x="535" y="405" text-anchor="middle" class="b">固定状态更新</text><text x="535" y="435" text-anchor="middle" class="k">长程低成本记忆</text>
  <rect x="700" y="320" width="210" height="150" rx="16" fill="#eaf2ff" stroke="#2876f9" stroke-width="3"/><text x="805" y="370" text-anchor="middle" class="h" fill="#1965db">Gated MLA</text><text x="805" y="405" text-anchor="middle" class="b">显式历史条目</text><text x="805" y="435" text-anchor="middle" class="k">精确回查补丁</text>
  <rect x="560" y="510" width="240" height="48" rx="12" fill="#e6f7f0" stroke="#14956f" stroke-width="2"/><text x="680" y="541" text-anchor="middle" class="b">Stable LatentMoE · 896 选 16</text>
  <path d="M288 400H380" class="line"/><path d="M535 470L620 510" class="line"/><path d="M805 470L740 510" class="line"/>
  <rect x="1080" y="250" width="360" height="210" rx="20" fill="#fff7e7" stroke="#e89914" stroke-width="3"/><text x="1120" y="302" class="h" fill="#d58000">Attention Residuals</text><text x="1120" y="340" class="b">当前 Block 对历史 Block 做</text><text x="1120" y="369" class="b">归一化的跨深度读取</text><path d="M960 355H1065" class="line"/>
  <rect x="390" y="665" width="1050" height="130" rx="18" class="card"/><text x="430" y="710" class="h">训练与运行保障</text>
  <text x="460" y="754" class="b">Quantile Balancing</text><text x="460" y="779" class="k">容量约束下的路由</text><text x="785" y="754" class="b">Per-Head Muon</text><text x="785" y="779" class="k">按 Head 定义优化粒度</text><text x="1085" y="754" class="b">MXFP4 / MXFP8 QAT</text><text x="1085" y="779" class="k">训练中适应低精度分布</text>
  <path d="M570 665V588" stroke="#14956f" stroke-width="3" stroke-dasharray="8 8"/><path d="M900 665V588" stroke="#7658e8" stroke-width="3" stroke-dasharray="8 8"/><path d="M1210 665V485" stroke="#2876f9" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="800" y="846" text-anchor="middle" class="h">输出：长程推理、Coding Agent 与多模态任务</text>
</svg>
