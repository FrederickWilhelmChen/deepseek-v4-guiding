<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="system-ui,'Microsoft YaHei'" font-size="32" font-weight="700" fill="#172033">FP4 QAT：不是训练完再压缩，而是从训练阶段就适应“低精度眼镜”</text>
  <text x="60" y="98" font-family="system-ui,'Microsoft YaHei'" font-size="17" fill="#596579">2.8T 模型的部署格式不是发布后的附加项，而是后训练分布的一部分</text>
  <rect x="60" y="150" width="520" height="430" rx="24" fill="#fff" stroke="#ef4444" stroke-width="3"/>
  <text x="320" y="192" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#b91c1c">普通 PTQ：高清训练，最后突然戴模糊眼镜</text>
  <rect x="115" y="235" width="185" height="120" rx="18" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="208" y="278" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#2878ff">BF16 模型</text><text x="208" y="310" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">训练时看得很清楚</text>
  <line x1="300" y1="295" x2="365" y2="295" stroke="#596579" stroke-width="5"/>
  <rect x="365" y="235" width="150" height="120" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="440" y="278" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#b91c1c">发布前量化</text><text x="440" y="310" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">突然改成 FP4</text>
  <path d="M190 420 Q235 380 280 420 Q235 470 190 420Z" fill="#fff" stroke="#2878ff" stroke-width="4"/><circle cx="235" cy="420" r="18" fill="#2878ff"/><path d="M360 420 Q405 400 450 420 Q405 445 360 420Z" fill="#fff" stroke="#ef4444" stroke-width="4"/><circle cx="405" cy="420" r="10" fill="#ef4444"/>
  <text x="320" y="520" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">风险：模型从未学过如何在量化误差下保持行为</text>
  <rect x="620" y="150" width="520" height="430" rx="24" fill="#fff" stroke="#1f9d70" stroke-width="3"/>
  <text x="880" y="192" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#1f9d70">QAT：训练时就戴着低精度眼镜反复练习</text>
  <rect x="680" y="230" width="400" height="85" rx="16" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="880" y="263" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#1f9d70">FP32 Master Weight 保留优化精度</text><text x="880" y="291" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">优化器仍维护高精度参数</text>
  <rect x="680" y="345" width="400" height="85" rx="16" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="880" y="378" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#6d5ce7">Forward 模拟 MXFP4 权重 / MXFP8 激活</text><text x="880" y="406" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">模型持续看到未来部署中的数值误差</text>
  <rect x="680" y="460" width="400" height="85" rx="16" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="880" y="493" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#2878ff">SFT / RL 学会在低精度下修正行为</text><text x="880" y="521" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">让训练策略更接近真实线上策略</text>
  <rect x="110" y="620" width="980" height="66" rx="16" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="600" y="647" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#b91c1c">类比边界：K3 尚未披露哪些模块完整采用 MXFP4 / MXFP8</text><text x="600" y="673" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">尤其是 KDA State、Gated MLA KV、AttnRes Cache 和 RL Rollout 的精度格式仍待报告确认</text>
</svg>