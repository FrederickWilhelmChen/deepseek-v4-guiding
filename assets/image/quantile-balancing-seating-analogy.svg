<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Quantile Balancing 的约束分配</title><desc id="desc">Token 的 affinity 与 Expert 容量目标同时约束路由选择。</desc>
  <defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#12213a}.t{font-size:46px;font-weight:700}.s{font-size:24px;fill:#5d6b80}.h{font-size:27px;font-weight:700}.b{font-size:23px;fill:#536278}.k{font-size:20px;fill:#66758a}.g{stroke:#cbd7e6;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="30" fill="#f6f8fc"/><text x="80" y="85" class="t">Quantile Balancing：在匹配分与容量之间做约束分配</text><text x="80" y="124" class="s">不是轮询排座；每个 Token 仍偏好高分 Expert，但每个 Expert 也有接近目标的负载</text><path d="M80 160H1520" stroke="#d6deea" stroke-width="2"/>
  <text x="120" y="237" class="h">Token × Expert affinity</text><text x="865" y="237" class="h">两个同时成立的约束</text>
  <g><rect x="120" y="275" width="570" height="340" rx="16" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><g class="g"><path d="M230 275V615M345 275V615M460 275V615M575 275V615M120 343H690M120 411H690M120 479H690M120 547H690"/></g>
  <g class="b" text-anchor="middle"><text x="287" y="320">E₁</text><text x="402" y="320">E₂</text><text x="517" y="320">E₃</text><text x="632" y="320">E₄</text></g><g class="b"><text x="150" y="386">T₁</text><text x="150" y="454">T₂</text><text x="150" y="522">T₃</text><text x="150" y="590">T₄</text></g>
  <g class="h" text-anchor="middle"><text x="287" y="386" fill="#14956f">0.91</text><text x="402" y="386">0.52</text><text x="517" y="386">0.74</text><text x="632" y="386">0.31</text><text x="287" y="454">0.48</text><text x="402" y="454" fill="#14956f">0.88</text><text x="517" y="454">0.67</text><text x="632" y="454">0.29</text><text x="287" y="522">0.40</text><text x="402" y="522">0.61</text><text x="517" y="522" fill="#14956f">0.86</text><text x="632" y="522">0.78</text><text x="287" y="590">0.80</text><text x="402" y="590">0.32</text><text x="517" y="590">0.55</text><text x="632" y="590" fill="#14956f">0.83</text></g></g>
  <rect x="835" y="285" width="610" height="118" rx="16" fill="#f1edff" stroke="#7658e8" stroke-width="3"/><text x="875" y="331" class="h" fill="#6347d4">Token 分位数：保证每个 Token 选够 k 个</text><text x="875" y="367" class="b">基于自身分数分布确定 Top-K 门槛，而非平均轮询</text>
  <rect x="835" y="455" width="610" height="118" rx="16" fill="#eaf2ff" stroke="#2876f9" stroke-width="3"/><text x="875" y="501" class="h" fill="#1965db">Expert 分位数：让每个 Expert 接近容量目标</text><text x="875" y="537" class="b">容量 Bias 抑制过载选择，为空闲 Expert 留出进入机会</text>
  <rect x="835" y="655" width="610" height="96" rx="16" fill="#e6f7f0" stroke="#14956f" stroke-width="3"/><text x="1140" y="697" text-anchor="middle" class="h" fill="#108264">在配额约束下最大化总匹配分</text><text x="1140" y="727" text-anchor="middle" class="k">优先高 affinity，同时避免单个 Expert 长期过载</text>
  <rect x="120" y="720" width="570" height="64" rx="14" fill="#fff" stroke="#d33a36" stroke-width="2"/><text x="405" y="760" text-anchor="middle" class="b">K3 的具体 QB 版本与分布式实现尚未公开</text>
</svg>
