<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="system-ui,'Microsoft YaHei'" font-size="32" font-weight="700" fill="#172033">Quantile Balancing：不是轮流排座，而是“带配额的最优排座”</text>
  <text x="60" y="98" font-family="system-ui,'Microsoft YaHei'" font-size="17" fill="#596579">每个 Token 有偏好的 Expert，每个 Expert 又有容量目标；QB 同时满足两边</text>
  <rect x="60" y="145" width="500" height="465" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="310" y="185" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#172033">普通 Dynamic Bias：看上批结果再调一点</text>
  <g font-family="system-ui,'Microsoft YaHei'" font-size="15"><circle cx="130" cy="245" r="25" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="130" y="251" text-anchor="middle" fill="#2878ff" font-weight="700">T1</text><circle cx="130" cy="325" r="25" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="130" y="331" text-anchor="middle" fill="#1f9d70" font-weight="700">T2</text><circle cx="130" cy="405" r="25" fill="#fff2d8" stroke="#e59a18" stroke-width="2"/><text x="130" y="411" text-anchor="middle" fill="#c77d08" font-weight="700">T3</text><circle cx="130" cy="485" r="25" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="130" y="491" text-anchor="middle" fill="#6d5ce7" font-weight="700">T4</text></g>
  <g font-family="system-ui,'Microsoft YaHei'" font-size="16" text-anchor="middle" font-weight="700"><rect x="350" y="225" width="150" height="65" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="425" y="265" fill="#b91c1c">Expert A 过载</text><rect x="350" y="335" width="150" height="65" rx="12" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="425" y="375" fill="#1f9d70">Expert B 正常</text><rect x="350" y="445" width="150" height="65" rx="12" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="425" y="485" fill="#2878ff">Expert C 空闲</text></g>
  <path d="M155 245 C240 245 260 250 350 250" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M155 325 C240 300 270 265 350 255" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M155 405 C245 400 270 370 350 368" fill="none" stroke="#1f9d70" stroke-width="4"/><path d="M155 485 C245 470 270 475 350 477" fill="none" stroke="#2878ff" stroke-width="4"/>
  <text x="310" y="555" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">过载就把 Bias 减 γ，空闲就加 γ；简单便宜，但步长敏感</text>
  <rect x="620" y="145" width="520" height="465" rx="24" fill="#fff" stroke="#7c5ce7" stroke-width="3"/>
  <text x="880" y="185" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#6d5ce7">Quantile Balancing：先算门槛，再一次排得更均衡</text>
  <rect x="690" y="225" width="380" height="80" rx="16" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="880" y="257" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#6d5ce7">Token 分位数：每个 Token 的 Top-K 门槛</text><text x="880" y="284" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">保证每个 Token 选够 k 个 Expert</text>
  <rect x="690" y="335" width="380" height="80" rx="16" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="880" y="367" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#2878ff">Expert 分位数：每个 Expert 的容量 Bias</text><text x="880" y="394" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">让每个 Expert 接近目标 Token 数</text>
  <rect x="690" y="445" width="380" height="105" rx="16" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="880" y="480" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#1f9d70">在配额约束下最大化总匹配分</text><text x="880" y="510" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">不是平均轮询，也不是忽略 affinity 的硬分摊</text><text x="880" y="534" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">而是尽量把每个 Token 放到“最合适且未超载”的 Expert</text>
  <rect x="110" y="640" width="980" height="52" rx="14" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="600" y="672" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#b91c1c">类比边界：K3 使用哪一种 QB、如何做分布式 Quantile，目前仍未公开</text>
</svg>