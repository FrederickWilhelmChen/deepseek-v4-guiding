<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">mHC 与 Attention Residuals 的正交比较</title><desc id="desc">mHC 扩展残差流宽度，Attention Residuals 在网络深度上检索历史表示。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526078"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#12213a}.t{font-size:46px;font-weight:700}.s{font-size:24px;fill:#5d6b80}.h{font-size:27px;font-weight:700}.b{font-size:23px;fill:#536278}.k{font-size:20px;fill:#66758a}</style></defs>
  <rect width="1600" height="900" rx="30" fill="#f6f8fc"/><text x="80" y="85" class="t">mHC 与 AttnRes：一个扩展宽度，一个检索深度</text><text x="80" y="124" class="s">它们都是残差升级，但作用轴、连接范围与代价不同</text><path d="M80 160H1520" stroke="#d6deea" stroke-width="2"/>
  <rect x="85" y="220" width="650" height="520" rx="22" fill="#fff" stroke="#2876f9" stroke-width="3"/><text x="125" y="270" class="h" fill="#1965db">mHC · Width-expanded residual dynamics</text>
  <text x="125" y="312" class="b">同一层级保留多条 residual stream，并在相邻层间动态混合</text>
  <g stroke="#2876f9" stroke-width="4" fill="none"><path d="M165 400H610"/><path d="M165 490H610"/><path d="M165 580H610"/></g>
  <g fill="#eaf2ff" stroke="#2876f9" stroke-width="2"><rect x="220" y="365" width="115" height="70" rx="12"/><rect x="400" y="455" width="115" height="70" rx="12"/><rect x="545" y="545" width="115" height="70" rx="12"/></g>
  <text x="277" y="408" text-anchor="middle" class="b">stream 1</text><text x="457" y="498" text-anchor="middle" class="b">stream 2</text><text x="602" y="588" text-anchor="middle" class="b">stream 3</text>
  <path d="M335 400C375 400 360 490 400 490M515 490C550 490 530 580 545 580" stroke="#14956f" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <text x="125" y="680" class="h">核心：宽度方向的多流传递与混合</text><text x="125" y="712" class="k">约束近似双随机混合，避免多流放大和失控</text>
  <rect x="865" y="220" width="650" height="520" rx="22" fill="#fff" stroke="#7658e8" stroke-width="3"/><text x="905" y="270" class="h" fill="#6347d4">AttnRes · Depth-nonlocal retrieval</text>
  <text x="905" y="312" class="b">当前层对更早 Block 的表示做归一化聚合</text>
  <g fill="#f1edff" stroke="#7658e8" stroke-width="2"><rect x="935" y="570" width="240" height="65" rx="12"/><rect x="935" y="465" width="240" height="65" rx="12"/><rect x="935" y="360" width="240" height="65" rx="12"/></g>
  <text x="1055" y="611" text-anchor="middle" class="b">早期 Block</text><text x="1055" y="506" text-anchor="middle" class="b">中间 Block</text><text x="1055" y="401" text-anchor="middle" class="b">近期 Block</text>
  <circle cx="1290" cy="495" r="52" fill="#f1edff" stroke="#7658e8" stroke-width="3"/><text x="1290" y="502" text-anchor="middle" class="b">Attention</text><path d="M1175 602H1228M1175 497H1228M1175 392H1228" stroke="#7658e8" stroke-width="4" marker-end="url(#a)"/><path d="M1342 495H1410" stroke="#7658e8" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1415" y="462" width="70" height="66" rx="12" fill="#f1edff" stroke="#7658e8" stroke-width="2"/><text x="1450" y="503" text-anchor="middle" class="b">当前</text>
  <text x="905" y="680" class="h">核心：深度方向的历史表示寻址</text><text x="905" y="712" class="k">代价来自历史表示、激活内存与流水线通信</text>
  <rect x="245" y="790" width="1110" height="60" rx="14" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="800" y="829" text-anchor="middle" class="h">mHC 是 depth-local / width-expanded；AttnRes 是 width-normal / depth-nonlocal</text>
</svg>
