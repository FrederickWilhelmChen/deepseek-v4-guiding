<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="system-ui,'Microsoft YaHei'" font-size="32" font-weight="700" fill="#172033">mHC 与 AttnRes：多车道公路 vs 跨楼层电梯</text>
  <text x="60" y="98" font-family="system-ui,'Microsoft YaHei'" font-size="17" fill="#596579">它们都升级残差连接，但操作的是两个不同方向</text>
  <rect x="60" y="145" width="520" height="455" rx="24" fill="#fff" stroke="#2878ff" stroke-width="3"/>
  <text x="320" y="185" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="23" font-weight="700" fill="#2878ff">mHC：把一条路扩成多车道</text>
  <rect x="115" y="235" width="410" height="230" rx="18" fill="#172033"/>
  <line x1="150" y1="280" x2="490" y2="280" stroke="#fff" stroke-width="5"/><line x1="150" y1="345" x2="490" y2="345" stroke="#fff" stroke-width="5"/><line x1="150" y1="410" x2="490" y2="410" stroke="#fff" stroke-width="5"/>
  <g fill="#e7f0ff" stroke="#2878ff" stroke-width="2"><rect x="175" y="256" width="65" height="35" rx="8"/><rect x="285" y="321" width="65" height="35" rx="8"/><rect x="395" y="386" width="65" height="35" rx="8"/></g>
  <text x="320" y="500" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#172033">宽度方向：多条 residual stream 并行传递</text>
  <text x="320" y="530" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">双随机矩阵像红绿灯：允许换道，但限制放大和失控</text>
  <rect x="620" y="145" width="520" height="455" rx="24" fill="#fff" stroke="#7c5ce7" stroke-width="3"/>
  <text x="880" y="185" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="23" font-weight="700" fill="#6d5ce7">AttnRes：给高层装跨层电梯</text>
  <g font-family="system-ui,'Microsoft YaHei'" font-size="15" text-anchor="middle"><rect x="695" y="430" width="260" height="55" rx="10" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="825" y="464" fill="#2878ff" font-weight="700">早期 Block</text><rect x="695" y="335" width="260" height="55" rx="10" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="825" y="369" fill="#1f9d70" font-weight="700">中间 Block</text><rect x="695" y="240" width="260" height="55" rx="10" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="825" y="274" fill="#6d5ce7" font-weight="700">当前 Block</text></g>
  <rect x="995" y="225" width="75" height="275" rx="16" fill="#172033"/><text x="1032" y="350" text-anchor="middle" transform="rotate(-90 1032 350)" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#fff">Depth Attention</text>
  <line x1="995" y1="267" x2="955" y2="267" stroke="#7c5ce7" stroke-width="4"/><line x1="995" y1="362" x2="955" y2="362" stroke="#1f9d70" stroke-width="4"/><line x1="995" y1="457" x2="955" y2="457" stroke="#2878ff" stroke-width="4"/>
  <text x="880" y="530" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#172033">深度方向：当前层可重新读取早期表示</text>
  <rect x="115" y="630" width="970" height="58" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="655" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#172033">mHC 控制相邻层多流动态；AttnRes 解决跨深度寻址</text><text x="600" y="678" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="14" fill="#596579">两者理论上可组合，但内存、状态和流水线通信成本会叠加</text>
</svg>