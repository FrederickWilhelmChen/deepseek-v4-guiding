<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stable LatentMoE 的数据流</title><desc id="desc">Hidden State 先压缩到 latent 空间，路由选择 896 个专家中的 16 个，聚合后投影回原维度。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526078"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#12213a}.t{font-size:46px;font-weight:700}.s{font-size:24px;fill:#5d6b80}.h{font-size:27px;font-weight:700}.b{font-size:23px;fill:#536278}.k{font-size:20px;fill:#66758a}.line{stroke:#526078;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" rx="30" fill="#f6f8fc"/><text x="80" y="85" class="t">Stable LatentMoE：先缩小专家工作的表示，再做稀疏路由</text><text x="80" y="124" class="s">“896 个专家、每个 Token 激活 16 个”的关键是通信和 Expert 计算发生在 latent 空间</text><path d="M80 160H1520" stroke="#d6deea" stroke-width="2"/>
  <rect x="80" y="330" width="190" height="150" rx="18" fill="#eaf2ff" stroke="#2876f9" stroke-width="3"/><text x="175" y="388" text-anchor="middle" class="h" fill="#1965db">Hidden State</text><text x="175" y="422" text-anchor="middle" class="b">原始维度 d</text><text x="175" y="450" text-anchor="middle" class="k">通信负担较大</text>
  <rect x="380" y="330" width="220" height="150" rx="18" fill="#f1edff" stroke="#7658e8" stroke-width="3"/><text x="490" y="388" text-anchor="middle" class="h" fill="#6347d4">Down Projection</text><text x="490" y="422" text-anchor="middle" class="b">压缩为 latent</text><text x="490" y="450" text-anchor="middle" class="k">维度 dₗ &lt; d</text><path d="M270 405H368" class="line"/>
  <rect x="710" y="270" width="260" height="270" rx="20" fill="#fff7e7" stroke="#e89914" stroke-width="3"/><text x="840" y="326" text-anchor="middle" class="h" fill="#d58000">Router</text><text x="840" y="364" text-anchor="middle" class="b">在 896 个 Expert 中</text><text x="840" y="394" text-anchor="middle" class="b">为每个 Token 选 Top-16</text><rect x="752" y="435" width="175" height="56" rx="12" fill="#fff" stroke="#e89914" stroke-width="2"/><text x="840" y="471" text-anchor="middle" class="b">score + capacity</text><path d="M600 405H698" class="line"/>
  <rect x="1080" y="235" width="365" height="340" rx="20" fill="#e6f7f0" stroke="#14956f" stroke-width="3"/><text x="1120" y="286" class="h" fill="#108264">选中的 16 个 Expert</text>
  <g fill="#fff" stroke="#14956f" stroke-width="2"><rect x="1120" y="330" width="118" height="74" rx="12"/><rect x="1275" y="330" width="118" height="74" rx="12"/><rect x="1120" y="445" width="118" height="74" rx="12"/><rect x="1275" y="445" width="118" height="74" rx="12"/></g><text x="1179" y="375" text-anchor="middle" class="b">E₁</text><text x="1334" y="375" text-anchor="middle" class="b">E₂</text><text x="1179" y="490" text-anchor="middle" class="b">…</text><text x="1334" y="490" text-anchor="middle" class="b">E₁₆</text><text x="1260" y="550" text-anchor="middle" class="k">其余 880 个本 Token 不计算</text><path d="M970 405H1068" class="line"/>
  <rect x="1000" y="680" width="445" height="92" rx="16" fill="#eaf2ff" stroke="#2876f9" stroke-width="3"/><text x="1222" y="722" text-anchor="middle" class="h" fill="#1965db">聚合 → Up Projection → 输出</text><text x="1222" y="752" text-anchor="middle" class="k">将 Expert 结果恢复到原始 Hidden Dimension</text><path d="M1260 575V668" class="line"/>
  <rect x="80" y="680" width="735" height="92" rx="16" fill="#fff" stroke="#d33a36" stroke-width="2"/><text x="115" y="720" class="h" fill="#b72825">已知与未知的边界</text><text x="115" y="752" class="b">Latent 路径的稳定化细节尚未公开；图只表达已确认的压缩、路由与聚合关系</text>
</svg>
