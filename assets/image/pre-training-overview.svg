<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="980" viewBox="0 0 1448 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 56px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .head { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: white; }
      .item { font: 500 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .caption { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .summary { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .small-icon { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1448" height="980" fill="#f8fafc"/>

  <text x="724" y="72" text-anchor="middle" class="title">第 4 章：Pre-Training 总览</text>
  <text x="724" y="122" text-anchor="middle" class="subtitle">从训练数据到训练节奏，再到稳定性处理和基模评测</text>

  <!-- Left column -->
  <g filter="url(#shadow)">
    <rect x="48" y="166" width="318" height="620" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <path d="M68 166h278a20 20 0 0 1 20 20v82H48v-82a20 20 0 0 1 20-20z" fill="#0891b2"/>
    <text x="80" y="224" class="small-icon" fill="white">🧹</text>
    <text x="142" y="224" class="head">数据构造</text>

    <rect x="78" y="302" width="258" height="82" rx="10" fill="white" stroke="#a5f3fc"/>
    <text x="104" y="354" class="small-icon" fill="#0891b2">▣</text>
    <text x="158" y="354" class="item">清洗污染数据</text>

    <rect x="78" y="408" width="258" height="82" rx="10" fill="white" stroke="#a5f3fc"/>
    <text x="104" y="460" class="small-icon" fill="#0891b2">∞</text>
    <text x="158" y="460" class="item">保留长文档</text>

    <rect x="78" y="514" width="258" height="82" rx="10" fill="white" stroke="#a5f3fc"/>
    <text x="104" y="566" class="small-icon" fill="#0891b2">⌘</text>
    <text x="158" y="566" class="item">Tokenizer / FIM</text>

    <rect x="78" y="620" width="258" height="82" rx="10" fill="white" stroke="#a5f3fc"/>
    <text x="104" y="672" class="small-icon" fill="#0891b2">▦</text>
    <text x="158" y="672" class="item">Sample Mask</text>

    <line x1="78" y1="732" x2="336" y2="732" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="207" y="770" text-anchor="middle" class="caption" fill="#155e75">决定模型吃什么数据</text>
  </g>

  <!-- Middle-left column -->
  <g filter="url(#shadow)">
    <rect x="400" y="166" width="318" height="620" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M420 166h278a20 20 0 0 1 20 20v82H400v-82a20 20 0 0 1 20-20z" fill="#2563eb"/>
    <text x="432" y="224" class="small-icon" fill="white">🏗️</text>
    <text x="494" y="224" class="head">模型设置</text>

    <rect x="430" y="320" width="258" height="90" rx="10" fill="white" stroke="#bfdbfe"/>
    <text x="462" y="377" class="small-icon" fill="#2563eb">⚡</text>
    <text x="526" y="377" class="item">Flash</text>

    <rect x="430" y="452" width="258" height="90" rx="10" fill="white" stroke="#bfdbfe"/>
    <text x="462" y="509" class="small-icon" fill="#2563eb">🧠</text>
    <text x="526" y="509" class="item">Pro</text>

    <rect x="430" y="584" width="258" height="90" rx="10" fill="white" stroke="#bfdbfe"/>
    <text x="462" y="641" class="small-icon" fill="#2563eb">🔍</text>
    <text x="526" y="641" class="item">Attention 差异</text>

    <line x1="430" y1="732" x2="688" y2="732" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="559" y="770" text-anchor="middle" class="caption" fill="#1e40af">决定 Flash / Pro 怎么长</text>
  </g>

  <!-- Middle-right column -->
  <g filter="url(#shadow)">
    <rect x="752" y="166" width="318" height="620" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M772 166h278a20 20 0 0 1 20 20v82H752v-82a20 20 0 0 1 20-20z" fill="#16a34a"/>
    <text x="784" y="224" class="small-icon" fill="white">📏</text>
    <text x="846" y="224" class="head">训练节奏</text>

    <rect x="782" y="302" width="258" height="82" rx="10" fill="white" stroke="#bbf7d0"/>
    <text x="812" y="354" class="small-icon" fill="#16a34a">μ</text>
    <text x="874" y="354" class="item">AdamW + Muon</text>

    <rect x="782" y="408" width="258" height="82" rx="10" fill="white" stroke="#bbf7d0"/>
    <text x="812" y="460" class="small-icon" fill="#16a34a">↗</text>
    <text x="874" y="460" class="item">4K → 1M</text>

    <rect x="782" y="514" width="258" height="82" rx="10" fill="white" stroke="#bbf7d0"/>
    <text x="812" y="566" class="small-icon" fill="#16a34a">◫</text>
    <text x="874" y="566" class="item">Dense Warmup</text>

    <rect x="782" y="620" width="258" height="82" rx="10" fill="white" stroke="#bbf7d0"/>
    <text x="812" y="672" class="small-icon" fill="#16a34a">◆</text>
    <text x="874" y="672" class="item">CSA 引入</text>

    <line x1="782" y1="732" x2="1040" y2="732" stroke="#4ade80" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="911" y="770" text-anchor="middle" class="caption" fill="#166534">决定训练怎么推进</text>
  </g>

  <!-- Right column -->
  <g filter="url(#shadow)">
    <rect x="1104" y="166" width="296" height="620" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <path d="M1124 166h256a20 20 0 0 1 20 20v82h-296v-82a20 20 0 0 1 20-20z" fill="#ea580c"/>
    <text x="1136" y="224" class="small-icon" fill="white">🧯</text>
    <text x="1198" y="224" class="head">稳定与评测</text>

    <rect x="1132" y="302" width="240" height="82" rx="10" fill="white" stroke="#fed7aa"/>
    <text x="1160" y="354" class="small-icon" fill="#ea580c">↯</text>
    <text x="1218" y="354" class="item">Loss Spike</text>

    <rect x="1132" y="408" width="240" height="82" rx="10" fill="white" stroke="#fed7aa"/>
    <text x="1160" y="460" class="small-icon" fill="#ea580c">⇄</text>
    <text x="1218" y="460" class="item">Routing</text>

    <rect x="1132" y="514" width="240" height="82" rx="10" fill="white" stroke="#fed7aa"/>
    <text x="1160" y="566" class="small-icon" fill="#ea580c">⌁</text>
    <text x="1218" y="566" class="item">Clamping</text>

    <rect x="1132" y="620" width="240" height="82" rx="10" fill="white" stroke="#fed7aa"/>
    <text x="1160" y="672" class="small-icon" fill="#ea580c">▤</text>
    <text x="1218" y="672" class="item">Benchmark</text>

    <line x1="1132" y1="732" x2="1372" y2="732" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="1252" y="770" text-anchor="middle" class="caption" fill="#9a3412">观察训练是否稳</text>
  </g>

  <!-- Summary strip -->
  <g filter="url(#shadow)">
    <rect x="48" y="838" width="1352" height="98" rx="18" fill="#fefce8" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="112" cy="887" r="30" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="112" cy="887" r="10" fill="#ca8a04"/>
    <text x="172" y="897" class="summary" fill="#1f2937">Pre-Training = </text>
    <text x="422" y="897" class="summary" fill="#0e7490">数据分布</text>
    <text x="560" y="897" class="summary" fill="#2563eb"> + 模型规模</text>
    <text x="760" y="897" class="summary" fill="#166534"> + 训练节奏</text>
    <text x="972" y="897" class="summary" fill="#c2410c"> + 稳定性处理</text>
  </g>
</svg>
