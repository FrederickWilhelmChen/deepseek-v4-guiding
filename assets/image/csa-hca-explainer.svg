<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 52px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .head { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: white; }
      .item { font: 500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .caption { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .summary { font: 700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .small-icon { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .small { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="800" y="68" text-anchor="middle" class="title">长上下文注意力的四种阅读方式</text>
  <text x="800" y="114" text-anchor="middle" class="subtitle">统一用 10 个历史块来理解：全看、只看最近、挑重点看、压成全局摘要</text>

  <g filter="url(#shadow)">
    <rect x="32" y="154" width="360" height="650" rx="20" fill="#f9fafb" stroke="#64748b" stroke-width="1.5"/>
    <path d="M52 154h320a20 20 0 0 1 20 20v78H32v-78a20 20 0 0 1 20-20z" fill="#475569"/>
    <text x="58" y="209" class="small-icon" fill="white">📖</text>
    <text x="124" y="209" class="head">全量细读</text>
    <text x="62" y="292" class="tiny">10 个历史块全部保留细节</text>
    <g>
      <rect x="62" y="322" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="116" y="322" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="170" y="322" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="224" y="322" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="278" y="322" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="62" y="382" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="116" y="382" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="170" y="382" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="224" y="382" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><rect x="278" y="382" width="44" height="44" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
    </g>
    <text x="214" y="458" text-anchor="middle" class="small">10 / 10 块都参与</text>
    <rect x="74" y="470" width="276" height="70" rx="12" fill="white" stroke="#cbd5e1"/>
    <text x="212" y="513" text-anchor="middle" class="label">都看、都存、都参与</text>
    <rect x="60" y="580" width="304" height="120" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="82" y="620" class="item">适合：</text><text x="156" y="620" class="item">信息最完整</text>
    <text x="82" y="658" class="item">问题：</text><text x="156" y="658" class="item">1M context 成本太高</text>
    <line x1="60" y1="746" x2="364" y2="746" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="212" y="776" text-anchor="middle" class="caption" fill="#334155">理想基线，但现实中过贵</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="154" width="360" height="650" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <path d="M440 154h320a20 20 0 0 1 20 20v78H420v-78a20 20 0 0 1 20-20z" fill="#ea580c"/>
    <text x="446" y="209" class="small-icon" fill="white">🪟</text><text x="512" y="209" class="head">Sliding Window</text>
    <text x="450" y="292" class="tiny">只看最近的 2 个历史块</text>
    <g>
      <rect x="450" y="322" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/><rect x="504" y="322" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/><rect x="558" y="322" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/><rect x="612" y="322" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/><rect x="666" y="322" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/>
      <rect x="450" y="382" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/><rect x="504" y="382" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/><rect x="558" y="382" width="44" height="44" rx="7" fill="#ffedd5" stroke="#fdba74"/><rect x="612" y="382" width="44" height="44" rx="7" fill="#fb923c" stroke="#ea580c"/><rect x="666" y="382" width="44" height="44" rx="7" fill="#fb923c" stroke="#ea580c"/>
    </g>
    <text x="580" y="458" text-anchor="middle" class="small">10 个里只看最近 2 个</text>
    <rect x="462" y="470" width="276" height="70" rx="12" fill="white" stroke="#fed7aa"/><text x="600" y="513" text-anchor="middle" class="label">只保留“近处细节”</text>
    <rect x="448" y="580" width="304" height="120" rx="14" fill="white" stroke="#fed7aa"/>
    <text x="470" y="620" class="item">直觉：</text><text x="544" y="620" class="item">只翻手边最近几页</text>
    <text x="470" y="658" class="item">代价：</text><text x="544" y="658" class="item">远处历史基本看不到</text>
    <line x1="448" y1="746" x2="752" y2="746" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="600" y="776" text-anchor="middle" class="caption" fill="#9a3412">局部最清楚，但没有远景</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="808" y="154" width="360" height="650" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M828 154h320a20 20 0 0 1 20 20v78H808v-78a20 20 0 0 1 20-20z" fill="#2563eb"/>
    <text x="834" y="209" class="small-icon" fill="white">🎯</text><text x="900" y="209" class="head">CSA</text>
    <text x="838" y="292" class="tiny">按相关性，从 10 个里挑 2 个看</text>
    <g>
      <rect x="838" y="322" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/><rect x="892" y="322" width="44" height="44" rx="7" fill="#2563eb" stroke="#1d4ed8"/><rect x="946" y="322" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/><rect x="1000" y="322" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/><rect x="1054" y="322" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
      <rect x="838" y="382" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/><rect x="892" y="382" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/><rect x="946" y="382" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/><rect x="1000" y="382" width="44" height="44" rx="7" fill="#2563eb" stroke="#1d4ed8"/><rect x="1054" y="382" width="44" height="44" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    </g>
    <path d="M914 366 C930 408,956 438,974 470" stroke="#2563eb" stroke-width="3.5" fill="none"/>
    <path d="M1022 426 C1014 444,1002 456,992 470" stroke="#2563eb" stroke-width="3.5" fill="none"/>
    <text x="988" y="458" text-anchor="middle" class="small">10 个里按相关性挑 2 个</text>
    <rect x="850" y="470" width="276" height="70" rx="12" fill="white" stroke="#bfdbfe"/><text x="988" y="513" text-anchor="middle" class="label">重点片段保留更多细节</text>
    <rect x="836" y="580" width="304" height="120" rx="14" fill="white" stroke="#bfdbfe"/>
    <text x="858" y="620" class="item">直觉：</text><text x="932" y="620" class="item">不是看最近，而是挑重点</text>
    <text x="858" y="658" class="item">优势：</text><text x="932" y="658" class="item">远处重要信息也能进来</text>
    <line x1="836" y1="746" x2="1140" y2="746" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="988" y="776" text-anchor="middle" class="caption" fill="#1e40af">核心是“相关性选择”，不是“位置靠近”</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1196" y="154" width="372" height="650" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M1216 154h332a20 20 0 0 1 20 20v78H1196v-78a20 20 0 0 1 20-20z" fill="#16a34a"/>
    <text x="1222" y="209" class="small-icon" fill="white">🗺️</text><text x="1288" y="209" class="head">HCA</text>
    <text x="1226" y="292" class="tiny">把 10 个历史块压成 1 个全局摘要</text>
    <g>
      <rect x="1226" y="322" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1280" y="322" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1334" y="322" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1388" y="322" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1442" y="322" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/>
      <rect x="1226" y="382" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1280" y="382" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1334" y="382" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1388" y="382" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/><rect x="1442" y="382" width="44" height="44" rx="7" fill="#dcfce7" stroke="#86efac"/>
    </g>
    <path d="M1248 366 C1270 408,1300 438,1360 470" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1302 366 C1314 408,1330 438,1368 470" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1356 366 C1358 408,1360 438,1374 470" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1410 366 C1400 408,1394 438,1380 470" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1464 366 C1444 408,1422 438,1386 470" stroke="#16a34a" stroke-width="3" fill="none"/>
    <path d="M1248 426 C1270 438,1302 452,1360 488" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1302 426 C1318 438,1334 452,1368 488" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1356 426 C1360 438,1366 452,1374 488" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1410 426 C1402 438,1396 452,1380 488" stroke="#16a34a" stroke-width="3" fill="none"/><path d="M1464 426 C1448 438,1430 452,1388 488" stroke="#16a34a" stroke-width="3" fill="none"/>
    <rect x="1316" y="470" width="132" height="70" rx="12" fill="#86efac" stroke="#22c55e"/>
    <text x="1382" y="513" text-anchor="middle" class="label">1 个全局摘要</text>
    <text x="1382" y="558" text-anchor="middle" class="small">10 个被压成 1 个</text>
    <rect x="1230" y="580" width="304" height="120" rx="14" fill="white" stroke="#bbf7d0"/>
    <text x="1252" y="620" class="item">直觉：</text><text x="1326" y="620" class="item">像先看整本书提要</text>
    <text x="1252" y="658" class="item">代价：</text><text x="1326" y="658" class="item">知道大概，但细节更粗</text>
    <line x1="1230" y1="746" x2="1534" y2="746" stroke="#4ade80" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="1382" y="776" text-anchor="middle" class="caption" fill="#166534">保全局背景，不保逐块细节</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="32" y="850" width="1536" height="94" rx="18" fill="#fefce8" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="94" cy="897" r="26" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="94" cy="897" r="9" fill="#ca8a04"/>
    <text x="142" y="905" class="summary" fill="#1f2937">Sliding Window 看最近 2 个，</text>
    <text x="556" y="905" class="summary" fill="#1d4ed8">CSA 从 10 个里挑 2 个，</text>
    <text x="974" y="905" class="summary" fill="#166534">HCA 把 10 个压成 1 个摘要</text>
  </g>
</svg>