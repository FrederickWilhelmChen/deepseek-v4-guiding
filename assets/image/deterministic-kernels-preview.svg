<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<style>
.title{font:700 46px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
.subtitle{font:400 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
.head{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:white}
.label{font:650 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111827}
.small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
.summary{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
<marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/></marker>
<marker id="ao" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/></marker>
<marker id="ap" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/></marker>
</defs>
<rect width="1500" height="920" fill="#f8fafc"/>
<text x="750" y="62" text-anchor="middle" class="title">Deterministic Kernels：为什么可复现性很重要</text>
<text x="750" y="106" text-anchor="middle" class="subtitle">底层浮点误差很小，但在 MoE、采样和 Agent 轨迹里可能被放大成完全不同的路径</text>
<g filter="url(#shadow)"><rect x="55" y="156" width="315" height="160" rx="18" fill="#fff7ed" stroke="#fdba74"/><path d="M73 156h279a18 18 0 0 1 18 18v48H55v-48a18 18 0 0 1 18-18z" fill="#ea580c"/><text x="83" y="192" class="head">1. 浮点非结合律</text><text x="83" y="251" class="label">合并顺序一变</text><text x="83" y="282" class="small">同一批数的结果也可能不同</text></g>
<line x1="370" y1="236" x2="425" y2="236" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#shadow)"><rect x="425" y="156" width="315" height="160" rx="18" fill="#eff6ff" stroke="#93c5fd"/><path d="M443 156h279a18 18 0 0 1 18 18v48H425v-48a18 18 0 0 1 18-18z" fill="#2563eb"/><text x="453" y="192" class="head">2. GPU 并行合并</text><text x="453" y="251" class="label">split-k / split-KV</text><text x="453" y="282" class="small">reduction / atomicAdd 顺序不固定</text></g>
<line x1="740" y1="236" x2="795" y2="236" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#shadow)"><rect x="795" y="156" width="315" height="160" rx="18" fill="#fef2f2" stroke="#fca5a5"/><path d="M813 156h279a18 18 0 0 1 18 18v48H795v-48a18 18 0 0 1 18-18z" fill="#dc2626"/><text x="823" y="192" class="head">3. 上层路径分叉</text><text x="823" y="251" class="label">route / sample 改变</text><text x="823" y="282" class="small">微小差异变成离散选择变化</text></g>
<line x1="1110" y1="236" x2="1165" y2="236" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#shadow)"><rect x="1165" y="156" width="280" height="160" rx="18" fill="#f1f5f9" stroke="#94a3b8"/><path d="M1183 156h244a18 18 0 0 1 18 18v48H1165v-48a18 18 0 0 1 18-18z" fill="#475569"/><text x="1193" y="192" class="head">4. 难复现</text><text x="1193" y="251" class="label">同样输入</text><text x="1193" y="282" class="small">回退重跑可能换轨迹</text></g>
<g filter="url(#shadow)"><rect x="80" y="385" width="650" height="320" rx="22" fill="#eff6ff" stroke="#93c5fd"/><path d="M102 385h606a22 22 0 0 1 22 22v60H80v-60a22 22 0 0 1 22-22z" fill="#2563eb"/><text x="115" y="425" class="head">Batch-invariant：同一个 token 不受 batch 组织影响</text><rect x="125" y="505" width="230" height="62" rx="12" fill="white" stroke="#bfdbfe"/><text x="148" y="544" class="label">batch = [A]</text><rect x="415" y="505" width="270" height="62" rx="12" fill="white" stroke="#bfdbfe"/><text x="438" y="544" class="label">batch = [B, A, C]</text><line x1="355" y1="536" x2="415" y2="536" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="125" y="620" class="small">要求：A 的每一层输出在不同 batch 组织下 bitwise 一致。</text><text x="125" y="655" class="small">满 wave：一个 sequence 只放一个 SM；尾部 wave：固定累加顺序。</text></g>
<g filter="url(#shadow)"><rect x="770" y="385" width="650" height="320" rx="22" fill="#f0fdf4" stroke="#86efac"/><path d="M792 385h606a22 22 0 0 1 22 22v60H770v-60a22 22 0 0 1 22-22z" fill="#16a34a"/><text x="805" y="425" class="head">Determinism：同样输入重复跑必须一致</text><rect x="825" y="505" width="160" height="62" rx="12" fill="white" stroke="#bbf7d0"/><text x="850" y="544" class="label">SM 0 buffer</text><rect x="1015" y="505" width="160" height="62" rx="12" fill="white" stroke="#bbf7d0"/><text x="1040" y="544" class="label">SM 1 buffer</text><rect x="1205" y="505" width="160" height="62" rx="12" fill="white" stroke="#bbf7d0"/><text x="1230" y="544" class="label">SM 2 buffer</text><line x1="905" y1="567" x2="905" y2="615" stroke="#16a34a" stroke-width="3"/><line x1="1095" y1="567" x2="1095" y2="615" stroke="#16a34a" stroke-width="3"/><line x1="1285" y1="567" x2="1285" y2="615" stroke="#16a34a" stroke-width="3"/><line x1="905" y1="615" x2="1285" y2="615" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="825" y="655" class="small">做法：每个 SM / rank 写自己的 buffer，最后按固定顺序 reduction。</text></g>
<g filter="url(#shadow)"><rect x="80" y="770" width="1340" height="90" rx="18" fill="#fefce8" stroke="#eab308"/><text x="750" y="820" text-anchor="middle" class="summary">可复现性不是锦上添花，而是让训练问题进入“可调试阶段”的基础设施</text></g>
</svg>