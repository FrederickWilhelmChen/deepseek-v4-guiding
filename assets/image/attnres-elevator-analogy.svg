<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#596579"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="system-ui,'Microsoft YaHei'" font-size="32" font-weight="700" fill="#172033">Attention Residuals：从“层层传箱子”变成“跨楼层取资料”</text>
  <text x="60" y="98" font-family="system-ui,'Microsoft YaHei'" font-size="17" fill="#596579">当前层不必只接收一路累加后的混合状态，可以重新访问更早的层或 Block</text>
  <rect x="70" y="145" width="480" height="470" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="310" y="182" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#172033">普通 Residual：公共箱子一路往上</text>
  <g font-family="system-ui,'Microsoft YaHei'" font-size="16" text-anchor="middle">
    <rect x="135" y="505" width="350" height="60" rx="12" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="310" y="542" fill="#2878ff" font-weight="700">第 1 层：低层细节</text>
    <rect x="135" y="410" width="350" height="60" rx="12" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="310" y="447" fill="#1f9d70" font-weight="700">第 2 层：再加一次修正</text>
    <rect x="135" y="315" width="350" height="60" rx="12" fill="#fff2d8" stroke="#e59a18" stroke-width="2"/><text x="310" y="352" fill="#c77d08" font-weight="700">第 3 层：继续累加</text>
    <rect x="135" y="220" width="350" height="60" rx="12" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="310" y="257" fill="#6d5ce7" font-weight="700">当前层：收到已经混合的总箱子</text>
  </g>
  <line x1="310" y1="505" x2="310" y2="470" stroke="#596579" stroke-width="4" marker-end="url(#a)"/><line x1="310" y1="410" x2="310" y2="375" stroke="#596579" stroke-width="4" marker-end="url(#a)"/><line x1="310" y1="315" x2="310" y2="280" stroke="#596579" stroke-width="4" marker-end="url(#a)"/>
  <rect x="650" y="145" width="480" height="470" rx="24" fill="#fff" stroke="#7c5ce7" stroke-width="3"/>
  <text x="890" y="182" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="22" font-weight="700" fill="#6d5ce7">AttnRes：给当前层一部跨层电梯</text>
  <rect x="705" y="505" width="230" height="58" rx="12" fill="#e7f0ff" stroke="#2878ff" stroke-width="2"/><text x="820" y="541" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#2878ff">Block 1：词法与格式</text>
  <rect x="705" y="410" width="230" height="58" rx="12" fill="#e4f7ef" stroke="#1f9d70" stroke-width="2"/><text x="820" y="446" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#1f9d70">Block 2：局部模式</text>
  <rect x="705" y="315" width="230" height="58" rx="12" fill="#fff2d8" stroke="#e59a18" stroke-width="2"/><text x="820" y="351" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#c77d08">Block 3：高层语义</text>
  <rect x="705" y="220" width="230" height="58" rx="12" fill="#f2eaff" stroke="#7c5ce7" stroke-width="2"/><text x="820" y="256" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#6d5ce7">当前 Block</text>
  <rect x="980" y="230" width="90" height="320" rx="18" fill="#172033"/>
  <text x="1025" y="270" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#fff">深度</text><text x="1025" y="294" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#fff">电梯</text>
  <line x1="980" y1="249" x2="935" y2="249" stroke="#7c5ce7" stroke-width="4" marker-end="url(#a)"/><line x1="980" y1="344" x2="935" y2="344" stroke="#e59a18" stroke-width="3" marker-end="url(#a)"/><line x1="980" y1="439" x2="935" y2="439" stroke="#1f9d70" stroke-width="3" marker-end="url(#a)"/><line x1="980" y1="534" x2="935" y2="534" stroke="#2878ff" stroke-width="3" marker-end="url(#a)"/>
  <text x="890" y="590" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="15" fill="#596579">Softmax 决定这次更该取哪几个楼层的资料</text>
  <rect x="115" y="640" width="970" height="52" rx="14" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="600" y="672" text-anchor="middle" font-family="system-ui,'Microsoft YaHei'" font-size="16" font-weight="700" fill="#b91c1c">类比边界：AttnRes 通常仍是 Dense Softmax 聚合，不等于 Top-K 硬稀疏路由</text>
</svg>