<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Attention Residuals 的深度读取</title><desc id="desc">当前 Block 对历史 Block 使用 Softmax 权重聚合，而非层层传递固定总箱子。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7658e8"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#12213a}.t{font-size:46px;font-weight:700}.s{font-size:24px;fill:#5d6b80}.h{font-size:27px;font-weight:700}.b{font-size:23px;fill:#536278}.k{font-size:20px;fill:#66758a}</style></defs>
  <rect width="1600" height="900" rx="30" fill="#f6f8fc"/><text x="80" y="85" class="t">Attention Residuals：当前层可加权读取历史 Block</text><text x="80" y="124" class="s">从固定累加的深度传递，变成内容相关、归一化的深度寻址</text><path d="M80 160H1520" stroke="#d6deea" stroke-width="2"/>
  <rect x="100" y="220" width="440" height="520" rx="20" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="135" y="266" class="h">普通 Residual</text>
  <rect x="155" y="570" width="330" height="82" rx="12" fill="#eaf2ff" stroke="#2876f9" stroke-width="2"/><text x="320" y="620" text-anchor="middle" class="b">早期层输出</text><rect x="155" y="450" width="330" height="82" rx="12" fill="#e6f7f0" stroke="#14956f" stroke-width="2"/><text x="320" y="500" text-anchor="middle" class="b">中间层继续累加</text><rect x="155" y="330" width="330" height="82" rx="12" fill="#fff5df" stroke="#e89914" stroke-width="2"/><text x="320" y="380" text-anchor="middle" class="b">当前层只收到混合结果</text>
  <path d="M320 570V542M320 450V422" stroke="#526078" stroke-width="4" marker-end="url(#a)"/>
  <rect x="680" y="220" width="730" height="520" rx="20" fill="#fff" stroke="#7658e8" stroke-width="3"/><text x="720" y="266" class="h" fill="#6347d4">AttnRes · 深度 Attention</text>
  <rect x="745" y="555" width="235" height="72" rx="12" fill="#eaf2ff" stroke="#2876f9" stroke-width="2"/><text x="862" y="600" text-anchor="middle" class="b">Block 1 · 词法格式</text><rect x="745" y="445" width="235" height="72" rx="12" fill="#e6f7f0" stroke="#14956f" stroke-width="2"/><text x="862" y="490" text-anchor="middle" class="b">Block 2 · 局部模式</text><rect x="745" y="335" width="235" height="72" rx="12" fill="#fff5df" stroke="#e89914" stroke-width="2"/><text x="862" y="380" text-anchor="middle" class="b">Block 3 · 高层语义</text>
  <circle cx="1110" cy="470" r="72" fill="#f1edff" stroke="#7658e8" stroke-width="3"/><text x="1110" y="462" text-anchor="middle" class="h" fill="#6347d4">Softmax</text><text x="1110" y="494" text-anchor="middle" class="k">深度权重</text>
  <rect x="1240" y="430" width="125" height="82" rx="12" fill="#f1edff" stroke="#7658e8" stroke-width="2"/><text x="1302" y="479" text-anchor="middle" class="b">当前 Block</text>
  <path d="M980 371H1024M980 481H1024M980 591H1024M1182 470H1230" stroke="#7658e8" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <text x="1035" y="685" class="k">所有历史 Block 都可参与；权重由当前内容决定</text>
  <rect x="180" y="790" width="1240" height="60" rx="14" fill="#fff" stroke="#d33a36" stroke-width="2"/><text x="800" y="829" text-anchor="middle" class="h" fill="#b72825">边界：这是 Dense Softmax 聚合，不等于 Top-K 硬稀疏路由</text>
</svg>
