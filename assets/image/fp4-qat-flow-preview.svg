<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<style>
.title{font:700 46px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
.subtitle{font:400 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
.head{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:white}
.label{font:650 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111827}
.small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
.summary{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
<marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/></marker>
<marker id="ao" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/></marker>
<marker id="ap" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/></marker>
</defs>
<rect width="1500" height="920" fill="#f8fafc"/>
<text x="750" y="62" text-anchor="middle" class="title">FP4 QAT：把低精度纳入训练体系</text>
<text x="750" y="106" text-anchor="middle" class="subtitle">不是训练完再压缩，而是在训练阶段就让关键路径适应部署精度</text>
<g filter="url(#shadow)"><rect x="70" y="170" width="290" height="165" rx="18" fill="#fefce8" stroke="#eab308"/><path d="M88 170h254a18 18 0 0 1 18 18v48H70v-48a18 18 0 0 1 18-18z" fill="#ca8a04"/><text x="98" y="206" class="head">FP32 Master</text><text x="98" y="265" class="label">高精度主权重</text><text x="98" y="296" class="small">长期更新 / optimizer state</text></g>
<line x1="360" y1="252" x2="455" y2="252" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#shadow)"><rect x="455" y="170" width="265" height="165" rx="18" fill="#f1f5f9" stroke="#94a3b8"/><path d="M473 170h229a18 18 0 0 1 18 18v48H455v-48a18 18 0 0 1 18-18z" fill="#475569"/><text x="483" y="206" class="head">Quant / Decode</text><text x="483" y="265" class="label">量化与解码</text><text x="483" y="296" class="small">送入低精度训练路径</text></g>
<g filter="url(#shadow)"><rect x="845" y="120" width="300" height="150" rx="18" fill="#fff7ed" stroke="#fdba74"/><path d="M863 120h264a18 18 0 0 1 18 18v48H845v-48a18 18 0 0 1 18-18z" fill="#ea580c"/><text x="873" y="156" class="head">FP4：部署目标</text><text x="873" y="215" class="label">MoE expert weights</text><text x="873" y="246" class="small">降低存储与访存成本</text></g>
<line x1="720" y1="230" x2="845" y2="190" stroke="#ea580c" stroke-width="4" marker-end="url(#ao)"/>
<g filter="url(#shadow)"><rect x="845" y="320" width="300" height="150" rx="18" fill="#eff6ff" stroke="#93c5fd"/><path d="M863 320h264a18 18 0 0 1 18 18v48H845v-48a18 18 0 0 1 18-18z" fill="#2563eb"/><text x="873" y="356" class="head">FP8：训练承载</text><text x="873" y="415" class="label">FP4 解码后计算</text><text x="873" y="446" class="small">复用 FP8 training framework</text></g>
<line x1="720" y1="275" x2="845" y2="390" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/>
<g filter="url(#shadow)"><rect x="845" y="520" width="300" height="150" rx="18" fill="#f0fdf4" stroke="#86efac"/><path d="M863 520h264a18 18 0 0 1 18 18v48H845v-48a18 18 0 0 1 18-18z" fill="#16a34a"/><text x="873" y="556" class="head">BF16：敏感分数</text><text x="873" y="615" class="label">scores / top-k</text><text x="873" y="646" class="small">保留块选择质量</text></g>
<g filter="url(#shadow)"><rect x="70" y="450" width="650" height="170" rx="20" fill="#f0fdf4" stroke="#86efac"/><path d="M90 450h610a20 20 0 0 1 20 20v50H70v-50a20 20 0 0 1 20-20z" fill="#16a34a"/><text x="105" y="487" class="head">CSA indexer / qk path 也进入 FP4</text><text x="105" y="560" class="label">别让“为了省 KV cache 的 indexer”变成新成本中心</text><text x="105" y="592" class="small">cache / load / multiply 低精度；index scores / top-k selector 保留 BF16</text></g>
<line x1="720" y1="535" x2="845" y2="595" stroke="#16a34a" stroke-width="4" marker-end="url(#ag)"/>
<g filter="url(#shadow)"><rect x="1215" y="240" width="230" height="205" rx="22" fill="#faf5ff" stroke="#c4b5fd"/><path d="M1237 240h186a22 22 0 0 1 22 22v55h-230v-55a22 22 0 0 1 22-22z" fill="#7c3aed"/><text x="1248" y="280" class="head">Forward</text><text x="1248" y="342" class="label">训练 / 采样</text><text x="1248" y="374" class="small">尽量贴近部署路径</text><text x="1248" y="406" class="small">梯度经 STE 回主权重</text></g>
<line x1="1145" y1="195" x2="1215" y2="300" stroke="#ea580c" stroke-width="4" marker-end="url(#ao)"/>
<line x1="1145" y1="395" x2="1215" y2="355" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/>
<g filter="url(#shadow)"><rect x="1215" y="525" width="230" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="1248" y="570" class="label">STE 近似直通</text><text x="1248" y="605" class="small">梯度逻辑回到 FP32 master</text></g>
<line x1="1330" y1="445" x2="1330" y2="525" stroke="#7c3aed" stroke-width="4" marker-end="url(#ap)"/>
<g filter="url(#shadow)"><rect x="70" y="745" width="1375" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1"/><text x="110" y="792" class="summary">精度分工：</text><text x="255" y="792" class="label">FP32 保长期稳定</text><text x="545" y="792" class="label">FP4 降高频访存成本</text><text x="895" y="792" class="label">FP8 承载训练计算</text><text x="1185" y="792" class="label">BF16 保分数质量</text><text x="255" y="832" class="small">低精度不是部署补丁，而是训练时就要被系统性建模的目标。</text></g>
</svg>